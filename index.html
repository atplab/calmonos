/* ---- Social : on ne lit plus tous les profils, seulement le sien, ceux de mes amis et de ceux qui m’ont ajouté ou offert un cadeau ----
   Index d’appoint : codes/<CODE> = { u: uid } (recherche d’un ami par son code) ; inbox/<uid> = { <expéditeur>: 1 } (qui m’a ajouté ou gâté). */
const OKID=/^[A-Za-z0-9_-]{1,128}$/,OKC=/^[A-HJKMNP-Z2-9]{8}$/,MK='fb:mk:',tried=new Set();
let LIVE=null;
async function index(F,uid,d){
 if(!d||typeof d!=='object')return;const {Fs,db}=F;let S;
 try{S=new Set(JSON.parse(localStorage.getItem(MK+uid))||[])}catch(e){S=new Set()}
 const T=[];
 if(typeof d.code==='string'&&OKC.test(d.code))T.push(['c:'+d.code,()=>Fs.setDoc(Fs.doc(db,'codes/'+d.code),{u:uid})]);
 const R=new Set();
 Object.entries(d.fr||{}).forEach(([k,t])=>{if(+t>0&&OKID.test(k))R.add(k)});
 Object.values(d.s||{}).forEach(m=>{if(m&&typeof m==='object')Object.entries(m).forEach(([k,n])=>{if(+n>0&&OKID.test(k))R.add(k)})});
 R.forEach(k=>{if(k!==uid)T.push(['i:'+k,()=>Fs.setDoc(Fs.doc(db,'inbox/'+k),{[uid]:1},{merge:true})])});
 let ch=false;
 for(const [key,fn] of T.filter(t=>!S.has(t[0])&&!tried.has(uid+t[0])).slice(0,40)){
  tried.add(uid+key);
  try{await fn();S.add(key);ch=true}catch(e){tried.delete(uid+key)}
 }
 if(ch){try{localStorage.setItem(MK+uid,JSON.stringify([...S]))}catch(e){}}
}
function profilesCol(F){
 const {Fs,db,auth}=F,uid=auth.currentUser.uid;
 return{
  doc:id=>({
   set:async d=>{try{await Fs.setDoc(Fs.doc(db,'profiles/'+id),{j:JSON.stringify(d)})}catch(e){const x=new Error(e&&e.message||'x');x.code=code(e);throw x}if(id===uid)index(F,uid,d).catch(()=>{})},
   get:async()=>{try{const s=await Fs.getDoc(Fs.doc(db,'profiles/'+id));return{exists:s.exists(),data:()=>parse(s.data())}}catch(e){const x=new Error(e&&e.message||'x');x.code=code(e);throw x}},
   delete:async()=>{try{await Fs.deleteDoc(Fs.doc(db,'profiles/'+id))}catch(e){const x=new Error(e&&e.message||'x');x.code=code(e);throw x}}}),
  onSnapshot:(next,err)=>{
   const docs=new Map(),subs=new Map(),loaded=new Set(),extra=new Set();
   let own=null,inbox=[],gotOwn=false,gotInbox=false,late=false,dead=false,tm=0;
   const ready=()=>gotOwn&&(late||(gotInbox&&[...subs.keys()].every(k=>loaded.has(k))));
   const emit=()=>{tm=0;if(dead||!gotOwn)return;next({docs:[...docs].map(([id,v])=>({id,data:()=>v})),metadata:{fromCache:false,hasPendingWrites:false}})};
   const sched=()=>{if(dead||tm||!ready())return;tm=setTimeout(emit,40)};
   const watch=id=>{if(subs.has(id)||id===uid)return;
    subs.set(id,Fs.onSnapshot(Fs.doc(db,'profiles/'+id),s=>{if(dead)return;loaded.add(id);if(s.exists())docs.set(id,parse(s.data()));else docs.delete(id);sched()},()=>{loaded.add(id);sched()}))};
   const want=()=>{
    const ids=[];const add=k=>{if(OKID.test(k)&&k!==uid&&!ids.includes(k))ids.push(k)};
    if(own&&own.fr&&typeof own.fr==='object')Object.entries(own.fr).forEach(([k,t])=>{if(+t>0)add(k)});
    extra.forEach(add);inbox.forEach(add);
    const keep=new Set(ids.slice(0,80));
    keep.forEach(watch);
    subs.forEach((u,id)=>{if(!keep.has(id)){u();subs.delete(id);docs.delete(id);loaded.delete(id)}});
   };
   const u0=Fs.onSnapshot(Fs.doc(db,'profiles/'+uid),{includeMetadataChanges:true},s=>{
    if(dead)return;
    if(s.metadata.fromCache&&!s.exists())return;
    own=s.exists()?parse(s.data()):null;
    if(own)docs.set(uid,own);else docs.delete(uid);
    gotOwn=true;want();
    if(s.metadata.hasPendingWrites)return;
    sched();if(own)index(F,uid,own).catch(()=>{});
   },e=>{if(!dead&&err)err(e)});
   const u1=Fs.onSnapshot(Fs.doc(db,'inbox/'+uid),s=>{if(dead)return;const v=s.exists()?s.data():null;inbox=v&&typeof v==='object'?Object.keys(v):[];gotInbox=true;want();sched()},()=>{gotInbox=true;sched()});
   const tl=setTimeout(()=>{late=true;sched()},3000);
   const live={addExtra:(id,v)=>{extra.add(id);docs.set(id,v);loaded.add(id);want();if(gotOwn)emit()},
    stop:()=>{dead=true;clearTimeout(tm);clearTimeout(tl);try{u0()}catch(e){}try{u1()}catch(e){}subs.forEach(u=>{try{u()}catch(e){}});subs.clear()}};
   LIVE=live;
   return()=>{live.stop();if(LIVE===live)LIVE=null};
  }};
}

fb.lookup=async c=>{
 const F=await load(),{Fs,db,auth}=F;
 if(!auth.currentUser||!OKC.test(c))return null;
 const s=await Fs.getDoc(Fs.doc(db,'codes/'+c));if(!s.exists())return null;
 const d=s.data(),id=d&&d.u;if(typeof id!=='string'||!OKID.test(id))return null;
 const p=await Fs.getDoc(Fs.doc(db,'profiles/'+id));if(!p.exists())return null;
 if(LIVE)LIVE.addExtra(id,parse(p.data()));
 return id;
};

/* chemin d’un chapitre (coordonnées locales 390 × SH) : départ en bas au centre, arrivée en haut au centre, 10 étapes qui serpentent */
function sGeo(c){
 const r=rng(300+c*91),ph=r()*6,P=[c===0?[190,1596]:[195,SH]];
 if(c===0)P.push([195,1452]);
 for(let i=0;i<10;i++){const y=1390-i*(1390-165)/9,x=195+Math.sin(i*1.3+ph)*(86+r()*16);P.push([Math.max(80,Math.min(310,x)),y])}

 for(let i=0;i<P.length-1;i++){
  const a=P[Math.max(0,i-1)],b=P[i],d=P[i+1],e=P[Math.min(P.length-1,i+2)];ix.push(pts.length);
  for(let k=0;k<14;k++){const t=k/14,t2=t*t,t3=t2*t,f=(p,q,u,v)=>.5*((2*q)+(-p+u)*t+(2*p-5*q+4*u-v)*t2+(-p+3*q-3*u+v)*t3);pts.push([f(a[0],b[0],d[0],e[0]),f(a[1],b[1],d[1],e[1])])}
 }

}

 if(c===0)L.push({x:178,y:1632,rx:170,ry:86,a:-1.5,boss:0,crash:1});/* l’île du crash, sous le départ */

 try{await SO.col.doc(SO.uid).set({code:M.code,name:M.name,nt:M.nt,fr:M.fr,s:M.s,d:M.d,at:Date.now()});SO.we=false;SO.tries=0}
 catch(e){const c=e&&e.code;if(c==='invalid_argument'||c==='not_granted'){SO.can=false;SO.st='ro'}else{SO.we=true;if(SO.tries++<3){clearTimeout(SO.pt);SO.pt=setTimeout(socPush,20000)}}}

function socBody(){

 if(!SO.can&&!(M&&M.code))return crd('Accès en lecture seule','Pour ajouter des amis et envoyer des flocons, il faut le rôle Contributeur sur cette page. Demande à la personne qui te l’a partagée de changer ton accès.');
 if(!SO.got||!M||!M.code){const w=SO.st==='slow'||SO.st==='err';return crd(w?'Pas de réponse pour l’instant':'Un instant…',w?'Le Social se connectera dès que possible. Tes flocons et tes niveaux ne bougent pas.':'Ton profil se prépare.')}
 const me=SO.uid,P=SO.P,live=SO.can&&SO.got&&!!SO.col;
 const nameOf=id=>(P[id]&&P[id].name)||'Ami',hue=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%360;return h};
 const av=id=>`<span class="fr-av" style="--h:${hue(id)}" aria-hidden="true">${esc(([...nameOf(id)][0]||'?').toUpperCase())}</span>`;
 const list=Object.entries(M.fr).filter(([,t])=>t>0).map(([id])=>id).sort((a,b)=>nameOf(a).localeCompare(nameOf(b),'fr'));
 const back=Object.keys(P).filter(id=>id!==me&&P[id].fr[me]>0&&!(M.fr[id]>0)).sort((a,b)=>nameOf(a).localeCompare(nameOf(b),'fr'));
 const day=SO.dy=socDay(),row=id=>{const p=P[id],r=SO.rec[id],dn=((M.d||{})[id]||'')>=day;
  return`<div class="fr-i">${av(id)}<div class="fr-t"><b>${esc(nameOf(id))}</b><small>${p?(p.fr[me]>0?'Amis':'N’a pas encore ajouté ton code'):'Profil introuvable'}${r?' · t’a offert '+r+'\u00a0❄':''}</small></div><div class="fr-b">${dn?`<button class="sb done" data-a="socSend" data-v="${esc(id)}" aria-label="Cadeau déjà offert aujourd’hui à ${esc(nameOf(id))}" disabled>Offert aujourd’hui ✓</button>`:`<button class="sb buy${SO.cf===id?' cf':''}" data-a="socSend" data-v="${esc(id)}" aria-label="Offrir ${SG} flocons à ${esc(nameOf(id))}"${live&&p?'':' disabled'}>${SO.cf===id?'Confirmer · offrir '+SG+' ❄':'Offrir '+SG+' ❄'}</button>`}<button class="lnk" data-a="socRm" data-v="${esc(id)}">${SO.rm===id?'Confirmer le retrait':'Retirer'}</button></div></div>`};
 const inc=id=>`<div class="fr-i">${av(id)}<div class="fr-t"><b>${esc(nameOf(id))}</b><small>T’a ajouté(e) avec ton code</small></div><div class="fr-b"><button class="sb buy" data-a="socBack" data-v="${esc(id)}"${live?'':' disabled'}>Ajouter</button></div></div>`;
 const named=M.nt>0;
 const A=!named?`<section class="glass play soc-i"><div class="sy-h" style="margin-top:0">Mon code ami</div><div class="sadd"><div class="code lock" aria-label="Code ami verrouillé">🔒 ••••-••••</div><button class="btn alt" disabled>Copier</button></div><div class="sy-h">Choisis ton pseudo</div><div class="sadd"><input class="ci nm" id="soc-nm" type="text" maxlength="20" autocomplete="off" spellcheck="false" placeholder="Ton pseudo" aria-label="Choisis ton pseudo" value="${esc(SO.nm||'')}"><button class="btn" data-a="socNm"${SO.can?'':' disabled'}>Valider</button></div><p class="note" style="margin:10px 0 0">Ton code ami se débloque dès que tu as choisi un pseudo. Il sera visible, avec ton pseudo, par les personnes qui ont accès à cette page.</p></section>`:`<section class="glass play soc-i"><div class="sy-h" style="margin-top:0">Mon code ami</div><div class="sadd"><div class="code" id="soc-code" aria-label="Mon code ami">${socFmt(M.code)}</div><button class="btn alt" data-a="socCp" id="soc-cp">Copier</button></div><div class="sy-h">Mon pseudo</div><div class="sadd"><input class="ci nm" id="soc-nm" type="text" maxlength="20" autocomplete="off" spellcheck="false" aria-label="Mon pseudo" value="${esc(SO.nm===null?M.name:SO.nm)}"><button class="btn alt" data-a="socNm"${SO.can?'':' disabled'}>Enregistrer</button></div><p class="note" style="margin:10px 0 0">Ton pseudo et ton code sont visibles par les personnes qui ont accès à cette page.</p></section>`;
 const B=`<h2 class="s">Ajouter un ami</h2><section class="glass play soc-i"><div class="sadd"><input class="ci" id="soc-in" type="text" maxlength="14" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Code de ton ami" aria-label="Code ami à ajouter" value="${esc(SO.in)}"><button class="btn" data-a="socAdd"${live?'':' disabled'}>Ajouter</button></div><p class="m${SO.merr?' err':''}" id="soc-m" role="status" aria-live="polite">${esc(SO.m)}</p></section>`;
 const C=`<h2 class="s">Mes amis${list.length?' · '+list.length:''}</h2><section class="glass play soc-i">${list.length?`<p class="note" style="margin:0 0 4px">Offrir ${SG} ❄ à un ami : c’est gratuit : ça ne coûte rien à ton total, et ils arrivent dans le sien. Un cadeau par ami et par jour.</p>${list.map(row).join('')}`:'<p class="note" style="margin:0">Pas encore d’amis. Donne ton code à quelqu’un, ou saisis le sien ci-dessus.</p>'}<p class="m${SO.mse?' err':''}" id="soc-ms" role="status" aria-live="polite">${esc(SO.ms)}</p>${SO.we?'<p class="note" style="margin:0;text-align:center">Envoi en attente : il repartira dès que possible.</p>':''}</section>`;
 const D=(back.length?`<h2 class="s">Ils t’ont ajouté</h2><section class="glass play soc-i">${back.map(inc).join('')}</section>`:'');
 return C+D+B+A;
}
function socRefresh(){
 if(!socOn())return;
 const root=$('#soc');if(!root)return;
 const h=socBody();if(h===SO.h)return;SO.h=h;
 const a=document.activeElement,id=a&&root.contains(a)?a.id:'',s=id?a.selectionStart:0,e=id?a.selectionEnd:0;
 root.innerHTML=h;
 if(id){const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(s,e)}catch(_){}}}
}

 cur=null;origin='home';nv('soc');mt='m';SO.want=true;SO.cf='';SO.rm='';SO.h='';
 app.innerHTML=`<header class="top"><h1>Social</h1><div class="tr"><div class="chip">❄ ${FLX()}</div></div></header><button class="quote" data-a="open" data-v="quote" aria-label="Ouvrir le carnet du soir : ${Q[di%Q.length]}"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><p>«&nbsp;${Q[di%Q.length]}&nbsp;»</p></button><div id="soc" class="soc"></div>`;

const socFail=t=>{SO.ms=t;SO.mse=true;SO.cf='';socRefresh()};
function socAddId(id){
 const M=st.get('soc:me',null);
 if(M.fr[id]>0)return'dup';
 if(Object.values(M.fr).filter(t=>t>0).length>=SMAX)return'max';
 M.fr[id]=Math.max(Date.now(),Math.abs(M.fr[id]||0)+1);st.set('soc:me',M);socLater();return'ok'}
Object.assign(act,{
 socCp:async()=>{const M=st.get('soc:me',null);if(!M||!M.code||!(M.nt>0))return;let ok=false;try{await navigator.clipboard.writeText(socFmt(M.code));ok=true}catch(e){}
  if(!ok){try{const r=document.createRange();r.selectNodeContents($('#soc-code'));const g=getSelection();g.removeAllRanges();g.addRange(r)}catch(e){}}
  const b=$('#soc-cp');if(b){b.textContent=ok?'Copié ✓':'Sélectionné';setTimeout(()=>{const b2=$('#soc-cp');if(b2)b2.textContent='Copier'},2200)}},
 socNm:()=>{const M=st.get('soc:me',null);if(!M||!SO.can)return;
  const v=String(SO.nm===null?(M.nt>0?M.name:''):SO.nm).replace(/\s+/g,' ').trim().slice(0,20);
  if(!v){SO.ms='Choisis un pseudo (20 caractères au maximum).';SO.mse=true;return socRefresh()}
  const named0=M.nt>0;M.name=v;M.nt=Math.max(Date.now(),M.nt+1);st.set('soc:me',M);SO.nm=null;SO.ms=named0?'Pseudo enregistré ✓':'Pseudo enregistré ✓ Ton code ami est débloqué.';SO.mse=false;socLater();SO.h='';socRefresh()},
 socAdd:()=>{
  const M=st.get('soc:me',null),c=socNorm(SO.in),bad=t=>{SO.m=t;SO.merr=true;socRefresh()};
  if(!M||!SO.can||!SO.got||!SO.col)return bad('Le Social n’est pas prêt : réessaie dans un instant.');
  if(!c)return bad('Saisis le code de ton ami.');
  if(!SOR.test(c))return bad('Ce code n’est pas valide : il fait 8 lettres et chiffres, comme '+socFmt('KQ7M4XD2')+'.');
  if(c===M.code)return bad('C’est ton propre code ! Donne-le plutôt à un ami.');
  const fin=hit=>{
   if(!hit)return bad('Aucun ami avec ce code. Vérifie-le, et demande-lui d’ouvrir d’abord l’onglet Social.');
   const r=socAddId(hit),n=(SO.P[hit]&&SO.P[hit].name)||'Ton ami';
   if(r==='dup')return bad(n+' est déjà dans tes amis.');
   if(r==='max')return bad('Tu as atteint la limite de '+SMAX+' amis.');
   SO.in='';SO.m=n+' ajouté(e) à tes amis ✓';SO.merr=false;SO.h='';socRefresh()};
  const hit0=Object.keys(SO.P).find(id=>id!==SO.uid&&SO.P[id].code===c);
  if(hit0||!(window.__fb&&window.__fb.lookup))return fin(hit0);
  SO.m='Recherche…';SO.merr=false;socRefresh();
  return window.__fb.lookup(c).then(id=>fin(id&&id!==SO.uid?id:null),()=>bad('Recherche impossible pour l’instant : réessaie dans un moment.'))},
 socBack:id=>{
  const M=st.get('soc:me',null);if(!M||!SO.can||!SO.got||!SO.col||!SO.P[id])return;
  const r=socAddId(id);
  if(r==='max')return socFail('Tu as atteint la limite de '+SMAX+' amis.');
  SO.ms=SO.P[id].name+' ajouté(e) à tes amis ✓';SO.mse=false;socRefresh()},
 socRm:id=>{
  const M=st.get('soc:me',null);if(!M||!(M.fr[id]>0))return;
  if(SO.rm!==id){SO.rm=id;clearTimeout(SO.rmt);SO.rmt=setTimeout(()=>{SO.rm='';socRefresh()},3500);return socRefresh()}
  clearTimeout(SO.rmt);SO.rm='';
  M.fr[id]=-Math.max(Date.now(),Math.abs(M.fr[id])+1);st.set('soc:me',M);SO.cf='';SO.ms='Ami retiré.';SO.mse=false;socLater();socRefresh()},
 socSend:id=>{
  const M=st.get('soc:me',null),p=SO.P[id];
  if(!M||!SO.can||!SO.got||!SO.col)return socFail('Le Social n’est pas prêt : réessaie dans un instant.');
  if(!(M.fr[id]>0)||!p)return socFail('Cet ami n’est plus dans ta liste.');
  M.d=M.d||{};
  if((M.d[id]||'')>=socDay())return socFail('Tu as déjà offert un cadeau à '+p.name+' aujourd’hui. Reviens demain !');
  if(SO.cf!==id){SO.cf=id;clearTimeout(SO.cft);SO.cft=setTimeout(()=>{SO.cf='';socRefresh()},3500);SO.ms='';SO.mse=false;return socRefresh()}
  clearTimeout(SO.cft);SO.cf='';
  const dv=socDev(),q=M.s[dv]||(M.s[dv]={});
  if((q[id]||0)+SG>SCAP)return socFail('Tu as déjà beaucoup gâté cet ami !');
  q[id]=(q[id]||0)+SG;M.d[id]=socDay();st.set('soc:me',M);
  SO.ms=SG+' ❄ envoyés à '+p.name+' ✓ À demain pour un autre cadeau.';SO.mse=false;sfx(660,.4);vib(20);socLater();socRefresh()}
});

const cv=$('#snow'),x=cv.getContext('2d');let W,H;const P=[];
const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener('resize',rs);
for(let i=0;i<45;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.5,v:.15+Math.random()*.35,d:Math.random()*6});

const snow=ts=>{if(!prefs().snow||document.hidden){if(sOn){x.clearRect(0,0,W,H);sOn=0}sT=0;return setTimeout(snow,300)}const k=sT?Math.min(3,(ts-sT)/16.67)||1:1;sT=ts||0;sOn=1;x.clearRect(0,0,W,H);x.fillStyle=`rgba(${Math.round(120+135*(1-GS))},${Math.round(110+145*(1-GS))},${Math.round(200+55*(1-GS))},${(.5+.2*(1-GS)).toFixed(2)})`;x.beginPath();for(const p of P){p.y+=p.v*k;p.d+=.004*k;p.x+=Math.sin(p.d)*.25*k;if(p.y>H+5){p.y=-5;p.x=Math.random()*W}x.moveTo(p.x+p.r,p.y);x.arc(p.x,p.y,p.r,0,7)}x.fill();requestAnimationFrame(snow)};
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)snow();
